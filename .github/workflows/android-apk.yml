name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Setup environment and keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          echo "Preparing environment..."
          # 1. Create .env if missing (required by secrets gradle plugin)
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # 2. Restore a STABLE debug keystore so every CI APK has the same signature.
          #    Without this, each build signs with a new random key and Android refuses
          #    to install it over the previous APK ("App not installed / conflicts").
          #    Store it once: base64 -w0 debug.keystore > debug.keystore.b64, then paste
          #    the contents into the repo secret DEBUG_KEYSTORE_BASE64.
          if [ -n "${DEBUG_KEYSTORE_BASE64}" ] && [ ! -f "debug.keystore" ]; then
            echo "Restoring debug.keystore from DEBUG_KEYSTORE_BASE64 secret..."
            echo "${DEBUG_KEYSTORE_BASE64}" | base64 -d > debug.keystore
          elif [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            echo "Restoring debug.keystore from base64 file..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi

          # 3. Fallback: generate debug keystore if still not present (signature will change!)
          if [ ! -f "debug.keystore" ]; then
            echo "::warning::No DEBUG_KEYSTORE_BASE64 secret set; generating a new key. Installed APKs will need uninstalling first."
            echo "Generating fallback debug keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=SinCC,C=LK"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SinCc-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create Release (On Version Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
